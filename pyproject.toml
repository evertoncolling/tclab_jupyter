[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tclab-jupyter"
version = "0.1.0"
description = "Notebook UI and reusable control/runtime components for the Temperature Control Lab."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Everton Colling", email = "evertoncolling@gmail.com" },
]
keywords = ["control", "jupyter", "mpc", "pid", "tclab"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "gekko>=1.0.6",
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
notebook = [
  "bqplot>=0.12.43",
  "ipywidgets>=8.1.2",
  "jupyter>=1.0.0",
]
hardware = [
  "tclab>=0.4.10",
]

[project.urls]
Homepage = "https://github.com/evertoncolling/tclab_jupyter"
Repository = "https://github.com/evertoncolling/tclab_jupyter"

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/LICENSE",
  "/src",
  "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tclab_jupyter"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["demo.ipynb"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "N",
]

[tool.ruff.lint.per-file-ignores]
"src/tclab_jupyter/backends.py" = ["N802"]
"src/tclab_jupyter/ui/__init__.py" = ["I001"]
"src/tclab_jupyter/ui/notebook.py" = ["E501", "I001", "N802", "N806"]
"tests/conftest.py" = ["I001"]
"tests/test_backends.py" = ["N802"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
  "pre-commit>=3.7.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "ty>=0.0.1a8",
]

[tool.uv]
default-groups = ["dev"]
